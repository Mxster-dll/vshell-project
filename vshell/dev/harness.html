            function mkFeat(t, r, g, b) {
              var hist = new Uint32Array(48);
              hist[r >> 4] = 64 * 36;

            function mkFrame(t, rgb) {

            out.minGap = S._testIngest([mkFeat(6.0, 255, 0, 0), mkFeat(6.3, 0, 255, 0), mkFeat(6.6, 0, 255, 0), mkFeat(6.9, 0, 0, 255), mkFeat(7.2, 0, 0, 255)]);
